<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C8B70"/>
      <stop offset="50%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#7A6340"/>
    </linearGradient>
  </defs>
  
  <!-- Wooden block background with rounded corners -->
  <rect x="10" y="10" width="180" height="180" rx="20" ry="20" fill="url(#woodGradient)" stroke="#6B5344" stroke-width="4"/>
  
  <!-- Black square inset -->
  <rect x="25" y="25" width="150" height="150" rx="10" ry="10" fill="#0a0a0a"/>
  
  <!-- Orange arrow pointing up and curving back -->
  <path d="M100 130 L100 50 M100 50 L70 80 M100 50 L130 80 M100 130 Q150 130 150 90 Q150 50 100 50" 
        stroke="#C47D57" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
